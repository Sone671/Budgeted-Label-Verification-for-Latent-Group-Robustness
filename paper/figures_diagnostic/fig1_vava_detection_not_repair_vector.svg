<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-labelledby="title desc">
  <title id="title">Detection is not repair: value-aligned label verification for worst-group robustness</title>
  <desc id="desc">A two-tier scientific workflow. The upper tier shows budgeted label verification without group labels during acquisition and group-based WGA evaluation after retraining. The lower tier contrasts detection-only selection with RV-Q value-aligned verification under the same budget.</desc>

  <defs>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #20272D; letter-spacing: 0; }
      .heading { font-size: 27px; font-weight: 700; }
      .small { font-size: 20px; font-weight: 400; fill: #5C6770; }
      .bracket-label { font-size: 29px; font-weight: 700; }
      .thesis { font-size: 48px; font-weight: 700; }
      .lane { font-size: 23px; font-weight: 500; }
      .lane-strong { font-size: 23px; font-weight: 700; }
      .math { font-family: TimesNewRoman; font-size: 27px; font-style: italic; fill: #20272D; }
      .panel { fill: #FFFFFF; stroke-width: 3.5; rx: 10; ry: 10; }
      .lane-box { fill: #FFFFFF; stroke-width: 3; rx: 9; ry: 9; }
      .connector { fill: none; stroke: #3B454D; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #3B454D; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .arrowhead { fill: #3B454D; stroke: none; }
      .arrowhead-green { fill: #28713A; stroke: none; }
      .rho-glyph { fill: none; stroke: #20272D; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .symbol-dark { fill: none; stroke: #20272D; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .symbol-red { fill: none; stroke: #BB412B; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .symbol-green { fill: none; stroke: #28713A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #3B454D; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .blue { stroke: #166E97; }
      .amber { stroke: #D59213; }
      .red { stroke: #BB412B; }
      .green { stroke: #28713A; }
      .gray { stroke: #5F686F; }
      .blue-text { fill: #166E97; }
      .red-text { fill: #BB412B; }
      .green-text { fill: #28713A; }
    </style>
  </defs>

  <rect width="1774" height="887" fill="#FFFFFF"/>

  <!-- Information boundary -->
  <g id="information-boundary">
    <path d="M 28 95 V 76 H 1268 V 95" fill="none" stroke="#166E97" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label bracket-label blue-text" x="648" y="58" text-anchor="middle">ACQUISITION: NO GROUP LABELS</text>
    <path d="M 1498 95 V 76 H 1750 V 95" fill="none" stroke="#5F686F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="1624" y="45" text-anchor="middle" fill="#5F686F" font-size="20" font-weight="700">
      <tspan x="1624" dy="0">EVALUATION ONLY:</tspan>
      <tspan x="1624" dy="24">GROUPS COMPUTE WGA</tspan>
    </text>
  </g>

  <!-- Upper workflow -->
  <g id="workflow">
    <rect class="panel" x="28" y="120" width="250" height="280" stroke="#20272D" fill="#F7F8F9"/>
    <rect class="panel blue" x="320" y="120" width="310" height="280" fill="#F1F7FA"/>
    <rect class="panel amber" x="680" y="120" width="235" height="280" fill="#FFF9ED"/>
    <rect class="panel red" x="960" y="120" width="255" height="280" fill="#FFF6F3"/>
    <rect class="panel green" x="1260" y="120" width="228" height="280" fill="#F3F8F4"/>
    <rect class="panel gray" x="1522" y="120" width="230" height="280" fill="#F7F8F8"/>

    <path class="flow" d="M 278 260 H 306"/><path class="arrowhead" d="M 306 251 L 320 260 L 306 269 Z"/>
    <path class="flow" d="M 630 260 H 666"/><path class="arrowhead" d="M 666 251 L 680 260 L 666 269 Z"/>
    <path class="flow" d="M 915 260 H 946"/><path class="arrowhead" d="M 946 251 L 960 260 L 946 269 Z"/>
    <path class="flow" d="M 1215 260 H 1246"/><path class="arrowhead" d="M 1246 251 L 1260 260 L 1246 269 Z"/>
    <path class="flow" d="M 1488 260 H 1508"/><path class="arrowhead" d="M 1508 251 L 1522 260 L 1508 269 Z"/>

    <!-- Noisy training set -->
    <text class="label heading" x="153" y="164" text-anchor="middle">
      <tspan x="153" dy="0">Noisy</tspan>
      <tspan x="153" dy="31">training set</tspan>
    </text>
    <g id="training-dots">
      <circle cx="82" cy="264" r="8" fill="#16789A"/>
      <circle cx="114" cy="245" r="8" fill="#16789A"/>
      <circle cx="149" cy="254" r="8" fill="#D59213"/>
      <circle cx="193" cy="250" r="8" fill="#C6452F"/>
      <circle cx="86" cy="300" r="8" fill="#377D4A"/>
      <circle cx="117" cy="281" r="8" fill="#377D4A"/>
      <circle cx="171" cy="281" r="8" fill="#C6452F"/>
      <circle cx="220" cy="280" r="8" fill="#C6452F"/>
      <circle cx="99" cy="328" r="8" fill="#D59213"/>
      <circle cx="134" cy="352" r="8" fill="#D59213"/>
      <circle cx="167" cy="331" r="8" fill="#377D4A"/>
      <circle cx="199" cy="341" r="8" fill="#377D4A"/>
      <circle cx="225" cy="320" r="8" fill="#377D4A"/>
      <circle cx="196" cy="302" r="8" fill="#C6452F"/>
    </g>

    <!-- Pre-query observables -->
    <text class="label heading" x="475" y="164" text-anchor="middle">
      <tspan x="475" dy="0">Pre-query</tspan>
      <tspan x="475" dy="31">observables</tspan>
    </text>
    <text class="label small" x="340" y="229">loss</text>
    <circle cx="389" cy="222" r="2.2" fill="#5C6770"/>
    <text class="label small" x="400" y="229">predictions</text>
    <circle cx="501" cy="222" r="2.2" fill="#5C6770"/>
    <text class="label small" x="512" y="229">validation tail</text>
    <g id="prequery-chart">
      <path class="thin" d="M 376 277 V 367 H 568" stroke-width="2.5"/>
      <rect x="386" y="296" width="11" height="71" fill="#5EA6C4" stroke="#20272D" stroke-width="1.5"/>
      <rect x="406" y="315" width="11" height="52" fill="#5EA6C4" stroke="#20272D" stroke-width="1.5"/>
      <rect x="426" y="333" width="11" height="34" fill="#5EA6C4" stroke="#20272D" stroke-width="1.5"/>
      <rect x="446" y="346" width="11" height="21" fill="#5EA6C4" stroke="#20272D" stroke-width="1.5"/>
      <path d="M 467 338 C 495 340 510 362 565 360" fill="none" stroke="#20272D" stroke-width="2" stroke-dasharray="9 8"/>
    </g>

    <!-- Budgeted query set -->
    <text class="label heading" x="797.5" y="164" text-anchor="middle">
      <tspan x="797.5" dy="0">Budgeted</tspan>
      <tspan x="797.5" dy="31">query set Q</tspan>
    </text>
    <g id="query-dots">
      <circle cx="728" cy="275" r="8" fill="#16789A"/>
      <circle cx="758" cy="256" r="8" fill="#16789A"/>
      <circle cx="792" cy="263" r="8" fill="#D59213"/>
      <circle cx="835" cy="257" r="8" fill="#C6452F"/>
      <circle cx="733" cy="306" r="8" fill="#377D4A"/>
      <circle cx="762" cy="289" r="8" fill="#16789A"/>
      <circle cx="812" cy="288" r="8" fill="#C6452F"/>
      <circle cx="845" cy="310" r="8" fill="#C6452F"/>
      <circle cx="746" cy="337" r="8" fill="#D59213"/>
      <circle cx="778" cy="357" r="8" fill="#D59213"/>
      <circle cx="810" cy="337" r="8" fill="#377D4A"/>
      <circle cx="850" cy="345" r="8" fill="#377D4A"/>
      <circle cx="872" cy="329" r="8" fill="#377D4A"/>
    </g>

    <!-- Verify and correct -->
    <text class="label heading" x="1087.5" y="164" text-anchor="middle">Verify &amp; correct</text>
    <g id="verification-dots">
      <circle cx="1010" cy="276" r="8" fill="#16789A"/><circle cx="1010" cy="276" r="11" fill="none" stroke="#20272D" stroke-width="2"/>
      <circle cx="1037" cy="249" r="8" fill="#16789A"/><circle cx="1037" cy="249" r="11" fill="none" stroke="#20272D" stroke-width="2"/>
      <circle cx="1075" cy="256" r="8" fill="#D59213"/>
      <circle cx="1104" cy="254" r="8" fill="#D59213"/><circle cx="1104" cy="254" r="11" fill="none" stroke="#20272D" stroke-width="2"/>
      <circle cx="1014" cy="310" r="8" fill="#C6452F"/>
      <circle cx="1041" cy="289" r="8" fill="#16789A"/>
      <circle cx="1078" cy="298" r="8" fill="#6E7422"/>
      <circle cx="1115" cy="304" r="8" fill="#C6452F"/>
      <circle cx="1145" cy="286" r="8" fill="#DA3DBD"/><circle cx="1145" cy="286" r="11" fill="none" stroke="#20272D" stroke-width="2"/>
      <circle cx="1026" cy="340" r="8" fill="#D59213"/>
      <circle cx="1057" cy="356" r="8" fill="#D59213"/>
      <circle cx="1057" cy="322" r="8" fill="#377D4A"/><circle cx="1057" cy="322" r="11" fill="none" stroke="#20272D" stroke-width="2"/>
      <circle cx="1090" cy="340" r="8" fill="#377D4A"/>
      <circle cx="1118" cy="356" r="8" fill="#19B83C"/><circle cx="1118" cy="356" r="11" fill="none" stroke="#20272D" stroke-width="2"/>
      <circle cx="1148" cy="330" r="8" fill="#377D4A"/>
    </g>

    <!-- Retraining network -->
    <text class="label heading" x="1374" y="164" text-anchor="middle">Retrain</text>
    <text class="label small" x="1374" y="194" text-anchor="middle">shared initialization</text>
    <g id="network" stroke="#20272D" stroke-width="1.5">
      <line x1="1319" y1="246" x2="1375" y2="250"/><line x1="1319" y1="246" x2="1375" y2="289"/><line x1="1319" y1="246" x2="1375" y2="328"/>
      <line x1="1319" y1="284" x2="1375" y2="250"/><line x1="1319" y1="284" x2="1375" y2="289"/><line x1="1319" y1="284" x2="1375" y2="328"/>
      <line x1="1319" y1="322" x2="1375" y2="250"/><line x1="1319" y1="322" x2="1375" y2="289"/><line x1="1319" y1="322" x2="1375" y2="328"/>
      <line x1="1375" y1="250" x2="1423" y2="273"/><line x1="1375" y1="250" x2="1423" y2="311"/>
      <line x1="1375" y1="289" x2="1423" y2="273"/><line x1="1375" y1="289" x2="1423" y2="311"/>
      <line x1="1375" y1="328" x2="1423" y2="273"/><line x1="1375" y1="328" x2="1423" y2="311"/>
      <g fill="#4A8B58">
        <circle cx="1319" cy="246" r="8"/><circle cx="1319" cy="284" r="8"/><circle cx="1319" cy="322" r="8"/>
        <circle cx="1375" cy="250" r="8"/><circle cx="1375" cy="289" r="8"/><circle cx="1375" cy="328" r="8"/>
        <circle cx="1423" cy="273" r="8"/><circle cx="1423" cy="311" r="8"/>
      </g>
    </g>

    <!-- Group evaluation -->
    <text class="label heading" x="1637" y="164" text-anchor="middle">Group evaluation</text>
    <g id="wga-chart">
      <path class="thin" d="M 1560 298 H 1714" stroke-width="2.5"/>
      <rect x="1577" y="247" width="12" height="51" fill="#4A8B58" stroke="#20272D" stroke-width="1.5"/>
      <rect x="1604" y="274" width="12" height="24" fill="#4A8B58" stroke="#20272D" stroke-width="1.5"/>
      <rect x="1632" y="260" width="12" height="38" fill="#4A8B58" stroke="#20272D" stroke-width="1.5"/>
      <rect x="1660" y="240" width="12" height="58" fill="#4A8B58" stroke="#20272D" stroke-width="1.5"/>
      <rect x="1688" y="215" width="12" height="83" fill="#4A8B58" stroke="#20272D" stroke-width="1.5"/>
      <path class="flow" d="M 1637 299 V 340"/>
      <path class="arrowhead" d="M 1628 340 L 1637 354 L 1646 340 Z"/>
    </g>
    <text class="label lane-strong green-text" x="1538" y="381">Repair utility</text>
    <path class="symbol-green" d="M 1668 381 L 1677 362 L 1686 381 Z"/>
    <text class="label lane-strong green-text" x="1688" y="381">WGA</text>
  </g>

  <!-- Lower contrast -->
  <g id="detection-vs-repair">
    <text class="label thesis" x="720" y="515" text-anchor="middle">DETECTION</text>
    <path class="symbol-dark" d="M 892 489 H 928 M 892 502 H 928 M 926 481 L 894 510"/>
    <text class="label thesis" x="1060" y="515" text-anchor="middle">REPAIR</text>

    <text class="label heading" x="105" y="622" text-anchor="middle">
      <tspan x="105" dy="0">Fixed</tspan>
      <tspan x="105" dy="31">budget B</tspan>
    </text>
    <circle cx="55" cy="686" r="9" fill="#16789A"/>
    <circle cx="90" cy="686" r="9" fill="#D59213"/>
    <circle cx="125" cy="686" r="9" fill="#C6452F"/>
    <circle cx="160" cy="686" r="9" fill="#377D4A"/>

    <path d="M 186 644 H 310" class="connector"/>
    <path d="M 310 644 V 588 H 361" class="flow"/><path class="arrowhead" d="M 361 579 L 375 588 L 361 597 Z"/>
    <path d="M 310 644 V 706 H 361" class="flow"/><path class="arrowhead" d="M 361 697 L 375 706 L 361 715 Z"/>

    <!-- Detection-only lane -->
    <rect class="lane-box red" x="375" y="548" width="245" height="80" fill="#FFF8F6"/>
    <rect class="lane-box red" x="690" y="548" width="263" height="80" fill="#FFF8F6"/>
    <rect class="lane-box red" x="1023" y="548" width="316" height="80" fill="#FFF8F6"/>
    <rect class="lane-box red" x="1415" y="548" width="295" height="80" fill="#FFF8F6"/>
    <path class="flow" d="M 620 588 H 676"/><path class="arrowhead" d="M 676 579 L 690 588 L 676 597 Z"/>
    <path class="flow" d="M 953 588 H 1009"/><path class="arrowhead" d="M 1009 579 L 1023 588 L 1009 597 Z"/>
    <path class="flow" d="M 1339 588 H 1401"/><path class="arrowhead" d="M 1401 579 L 1415 588 L 1401 597 Z"/>
    <text class="label lane" x="497.5" y="596" text-anchor="middle">Detection-only</text>
    <text class="label lane" x="798" y="596" text-anchor="middle">NoiseScore</text>
    <path class="rho-glyph" d="M 876 603 V 578 C 881 571 893 571 898 579 C 904 588 897 598 888 598 C 882 598 878 594 876 590"/>
    <text class="math" x="900" y="603" font-size="16">i</text>
    <text class="label lane" x="1181" y="578" text-anchor="middle">
      <tspan x="1181" dy="0">Mostly majority-group</tspan>
      <tspan x="1181" dy="28">corrections</tspan>
    </text>
    <text class="label lane red-text" x="1442" y="596">Small / unstable</text>
    <path class="symbol-red" d="M 1622 596 L 1631 577 L 1640 596 Z"/>
    <text class="label lane red-text" x="1642" y="596">WGA</text>

    <!-- Value-aligned lane -->
    <rect class="lane-box green" x="375" y="666" width="245" height="80" fill="#F5FAF6"/>
    <rect class="lane-box green" x="690" y="666" width="263" height="80" fill="#F5FAF6"/>
    <rect class="lane-box green" x="1023" y="666" width="316" height="80" fill="#F5FAF6"/>
    <rect class="lane-box green" x="1415" y="666" width="295" height="80" fill="#F5FAF6"/>
    <path class="flow" d="M 620 706 H 676"/><path class="arrowhead" d="M 676 697 L 690 706 L 676 715 Z"/>
    <path class="flow" d="M 953 706 H 1009"/><path class="arrowhead" d="M 1009 697 L 1023 706 L 1009 715 Z"/>
    <path class="flow" d="M 1339 706 H 1401"/><path class="arrowhead" d="M 1401 697 L 1415 706 L 1401 715 Z"/>
    <text class="label lane green-text" x="497.5" y="696" text-anchor="middle">
      <tspan x="497.5" dy="0">Value-aligned</tspan>
      <tspan x="497.5" dy="28">verification</tspan>
    </text>
    <text class="label lane" x="758" y="714" text-anchor="middle">RV-Q:</text>
    <text class="math" x="807" y="714">s</text><text class="math" x="820" y="721" font-size="16">i</text>
    <text class="math" x="835" y="714">=</text>
    <path class="rho-glyph" d="M 859 721 V 696 C 864 689 876 689 881 697 C 887 706 880 716 871 716 C 865 716 861 712 859 708"/>
    <text class="math" x="883" y="721" font-size="16">i</text>
    <text class="math" x="899" y="714">r</text><text class="math" x="911" y="721" font-size="16">i</text>
    <text class="label lane green-text" x="1181" y="696" text-anchor="middle">
      <tspan x="1181" dy="0">More weak-group</tspan>
      <tspan x="1181" dy="28">corrections</tspan>
    </text>
    <text class="label lane-strong green-text" x="1487" y="714">Larger</text>
    <path class="symbol-green" d="M 1566 714 L 1575 695 L 1584 714 Z"/>
    <text class="label lane-strong green-text" x="1586" y="714">WGA</text>

    <path d="M 821.5 746 V 788" fill="none" stroke="#28713A" stroke-width="3" stroke-dasharray="8 7"/>
    <path class="arrowhead-green" d="M 812.5 788 L 821.5 802 L 830.5 788 Z"/>
    <text class="math green-text" x="675" y="833">r</text><text class="math green-text" x="688" y="840" font-size="16">i</text>
    <text class="label lane green-text" x="700" y="833">: validation-tail repair value</text>
  </g>
</svg>
