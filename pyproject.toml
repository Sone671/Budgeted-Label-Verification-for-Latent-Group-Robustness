[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-group-verification-mvp"
version = "0.1.0"
description = "Stage 0-1 MVP for budgeted label verification under latent groups"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "scikit-learn>=1.3",
  "cleanlab>=2.7",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "folktables==0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
rv-stage0 = "robust_verify.cli.stage0:main"
rv-stage1 = "robust_verify.cli.stage1:main"
rv-run-all = "robust_verify.cli.run_all:main"
rv-smoke-test = "robust_verify.smoke_test:main"
rv-diagnostics = "robust_verify.cli.diagnostics:main"
rv-end-to-end = "robust_verify.cli.end_to_end:main"
rv-e2e-analysis = "robust_verify.cli.e2e_analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
